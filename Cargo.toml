[package]
name = "hondaecu-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
authors = ["VIRUXE"]
description = "A high-performance OKI MSM66207 virtual CPU emulator and ROM testing suite in Rust for Honda OBD1 ECUs"
license = "Unlicense"
repository = "https://github.com/VIRUXE/hondaecu-cli"
readme = "README.md"
keywords = ["honda", "ecu", "p28", "oki66207", "emulator"]
categories = ["emulators", "command-line-utilities"]

[features]
# ROM-backed integration tests. The images are not distributable, so these
# tests are ignored unless the matching feature is on, and with it on they
# fail if HONDAECU_P28_ROM / HONDAECU_P30_ROM / HONDAECU_LAUNCH_ROM does not
# name the image.
p28-rom = []
p30-rom = []
launch-rom = []
rom-fixtures = ["p28-rom", "p30-rom", "launch-rom"]
# The HTS D16Z6 base ROM (HONDAECU_HTS_ROM). A local opt-in only: it is not
# part of `rom-fixtures` and CI has no copy of it.
hts-rom = []
# The UberData ERM baseline (HONDAECU_ERM_ROM) and the P72 image
# (HONDAECU_P72_ROM). Local opt-ins like `hts-rom`.
erm-rom = []
p72-rom = []

[dependencies]
