name: Release Multi-Platform Binaries

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'

jobs:
  publish-binaries:
    name: Build Release Asset (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: hondaecu-cli-v0.1.0-linux-x86_64.tar.gz
            asset_path: target/x86_64-unknown-linux-gnu/release/hondaecu-cli
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: hondaecu-cli-v0.1.0-windows-x86_64.zip
            asset_path: target/x86_64-pc-windows-msvc/release/hondaecu-cli.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux Binary (tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C target/${{ matrix.target }}/release hondaecu-cli README.md LICENSE

      - name: Package Windows Binary (zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/hondaecu-cli.exe, README.md, LICENSE -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Release Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
