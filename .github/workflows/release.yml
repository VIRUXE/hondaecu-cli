name: Release

# Pushing a tag like v0.2.0 builds the program for each platform and attaches
# the archives to the GitHub release of that tag (creating it if needed).
# "Run workflow" on a branch does the same build and packaging as a dry run:
# the archives are kept as workflow artifacts and nothing is released.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the version from Cargo.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::no version found in Cargo.toml"
            exit 1
          fi
          # A release tag must name the version the program reports.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "name=hondaecu-cli-v$version-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Windows: a flat zip, because "Extract All" already makes a folder.
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/hondaecu-cli.exe, README.md, LICENSE -DestinationPath ${{ steps.version.outputs.name }}.zip

      # Linux and macOS: everything inside one folder named after the archive.
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ steps.version.outputs.name }}"
          cp "target/${{ matrix.target }}/release/hondaecu-cli" README.md LICENSE "dist/${{ steps.version.outputs.name }}/"
          tar -czf "${{ steps.version.outputs.name }}.tar.gz" -C dist "${{ steps.version.outputs.name }}"

      - name: Keep the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            ${{ steps.version.outputs.name }}.zip
            ${{ steps.version.outputs.name }}.tar.gz
          if-no-files-found: error

      - name: Attach the archive to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.version.outputs.name }}.zip
            ${{ steps.version.outputs.name }}.tar.gz
