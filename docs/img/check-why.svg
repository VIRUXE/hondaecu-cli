<text x="18" y="583" xml:space="preserve" style="white-space:pre" textLength="553.8" lengthAdjust="spacingAndGlyphs">     followed: 218h bit 5 (= 1), read at 4284h, set by 4AFAh at 2.193 s</text>
<text x="18" y="619" xml:space="preserve" style="white-space:pre" textLength="296.4" lengthAdjust="spacingAndGlyphs">  2. 4AFAh  SB off 018h.5   at 2.193 s</text>
