<text x="567" y="19" fill="#6e7681" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">hondaecu-cli check</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#c9d1d9">
<text x="18" y="61" xml:space="preserve" style="white-space:pre" textLength="351.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#3fb950" font-weight="bold">$ </tspan><tspan fill="#f0f6fc" font-weight="bold">hondaecu-cli check 203stock.bin --no-prompt</tspan></text>
<text x="18" y="79" xml:space="preserve" style="white-space:pre" textLength="780.0" lengthAdjust="spacingAndGlyphs">ROM: 203stock.bin   ECU: P28 manual   Car: stock-p28-manual (defaulted: all values, from the preset)</text>
<text x="18" y="115" xml:space="preserve" style="white-space:pre" textLength="678.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#f85149" font-weight="bold">VERDICT: DO NOT BURN - check-engine light: on at the end of the drive (lit since 2.2 s)</tspan></text>
<text x="18" y="133" xml:space="preserve" style="white-space:pre" textLength="23.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#6e7681">...</tspan></text>
<text x="18" y="151" xml:space="preserve" style="white-space:pre" textLength="639.6" lengthAdjust="spacingAndGlyphs">  check-engine light ....... <tspan fill="#f85149" font-weight="bold">PROBLEM:</tspan> on at the end of the drive (lit since 2.2 s)</text>
<text x="18" y="169" xml:space="preserve" style="white-space:pre" textLength="1060.8" lengthAdjust="spacingAndGlyphs">  codes .................... <tspan fill="#f85149" font-weight="bold">PROBLEM:</tspan> none blinked, although the check-engine light is on (the ROM is showing a fault it does not blink)</text>
<text x="18" y="187" xml:space="preserve" style="white-space:pre" textLength="23.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#6e7681">...</tspan></text>
<text x="18" y="223" xml:space="preserve" style="white-space:pre" textLength="1099.8" lengthAdjust="spacingAndGlyphs">WHY THE LIGHT IS ON (automatic trace: at each level the program picks what to follow by a rule of thumb; check it against the evidence shown)</text>
<text x="18" y="241" xml:space="preserve" style="white-space:pre" textLength="23.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#6e7681">...</tspan></text>
<text x="18" y="277" xml:space="preserve" style="white-space:pre" textLength="296.4" lengthAdjust="spacingAndGlyphs">  1. 42AEh  MB 022h.4, C   at 70.504 s</text>
<text x="18" y="295" xml:space="preserve" style="white-space:pre" textLength="780.0" lengthAdjust="spacingAndGlyphs">     set P1.4, the ROM's image of the lamp bit (82C55 port C bit 4), at the last time before 70.51 s</text>
<text x="18" y="313" xml:space="preserve" style="white-space:pre" textLength="78.0" lengthAdjust="spacingAndGlyphs">     path:</text>
<text x="18" y="331" xml:space="preserve" style="white-space:pre" textLength="85.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#6e7681">        ...</tspan></text>
<text x="18" y="349" xml:space="preserve" style="white-space:pre" textLength="553.8" lengthAdjust="spacingAndGlyphs">        26CEh  RB off 031h.2                          wrote 231h:89-&gt;89</text>
<text x="18" y="367" xml:space="preserve" style="white-space:pre" textLength="413.4" lengthAdjust="spacingAndGlyphs">        26D1h  JNE 026D4h                   not taken</text>
