<text x="18" y="853" xml:space="preserve" style="white-space:pre" textLength="522.6" lengthAdjust="spacingAndGlyphs">      * 27F7h  JBR off 027h.6, 0281Ch       not taken read 227h.6=1</text>
<text x="18" y="871" xml:space="preserve" style="white-space:pre" textLength="522.6" lengthAdjust="spacingAndGlyphs">      * 27FAh  JBS off 014h.7, 0281Ch       not taken read 214h.7=0</text>
<text x="18" y="889" xml:space="preserve" style="white-space:pre" textLength="647.4" lengthAdjust="spacingAndGlyphs">        27FDh  MOV DP, #00F00h                        wrote 084h:B6-&gt;00 085h:00-&gt;0F</text>
<text x="18" y="907" xml:space="preserve" style="white-space:pre" textLength="608.4" lengthAdjust="spacingAndGlyphs">      * 2800h  MB C, [DP].2                           read 0F00h.2=1 (outside)</text>
