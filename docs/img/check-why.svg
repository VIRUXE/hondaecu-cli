<text x="18" y="493" xml:space="preserve" style="white-space:pre" textLength="553.8" lengthAdjust="spacingAndGlyphs">        427Eh  MB 020h.7, C                           wrote 020h:4B-&gt;4B</text>
<text x="18" y="511" xml:space="preserve" style="white-space:pre" textLength="522.6" lengthAdjust="spacingAndGlyphs">      * 4281h  JBS off 010h.7, 042B1h       not taken read 210h.7=0</text>
